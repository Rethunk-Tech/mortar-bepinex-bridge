# Dependabot PRs are signal only: the equivalent bump is applied by hand on main and the PR
# closed (fleet dependency policy). Grouped and weekly so the signal stays one PR per ecosystem.
version: 2
# BepInEx and Il2CppInterop packages come from BepInEx's own feed (nuget.config); Dependabot reaches only declared registries.
registries:
  bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json
  nuget-org:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
updates:
  - package-ecosystem: nuget
    registries: [bepinex, nuget-org]
    directory: /src/MortarBepInExBridge
    # NuGet ignores do not honor version ranges (those are npm/pip/bundler only).
    ignore:
      - dependency-name: "BepInEx.Core"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: nuget
    registries: [bepinex, nuget-org]
    directory: /src/MortarBepInExBridge.IL2CPP
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: nuget
    registries: [bepinex, nuget-org]
    directory: /src/MortarBepInExBridge.Patcher
    # NuGet ignores do not honor version ranges (those are npm/pip/bundler only).
    ignore:
      - dependency-name: "BepInEx.BaseLib"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Mono.Cecil"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: nuget
    registries: [bepinex, nuget-org]
    directory: /tests/MortarBepInExBridge.Tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    groups:
      all:
        patterns: ["*"]
