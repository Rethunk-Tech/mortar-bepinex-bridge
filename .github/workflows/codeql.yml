# CodeQL advanced setup: every language in this repository with the security-and-quality suite, re-runnable
# from the Actions tab. C# is built the way CI builds it, so CodeQL sees resolved references; Actions workflows
# are extracted without a build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "44 6 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      # The restore and build scripts/verify.sh runs in CI, so CodeQL resolves the NuGet and game references.
      - name: Set up .NET
        if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore --locked-mode
          for dir in src/MortarBepInExBridge/Games/*/; do
            dotnet build MortarBepInExBridge.slnx -c Release --no-restore -p:Game="$(basename "$dir")"
          done
          dotnet build MortarBepInExBridge.slnx -c Release --no-restore
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
