name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A tag push publishes, so it is never cancelled by a later push to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # Dependabot PRs are never merged (the bump is applied by hand on main, where this runs), so CI on them is spent minutes.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      # The runner's apt shellcheck lags (0.9.0 on Ubuntu 24.04), so CI pins the release developers run.
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -x scripts/*.sh
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Install gate
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gate" https://github.com/Rethunk-Tech/rethunk-gate-cli/releases/download/v0.6.6/gate-linux-amd64
          echo "4c43aa2bfbcd61c58a01c02f3cb924c76d9062dc8df10f289a22d258ca7267b6  $RUNNER_TEMP/gate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/gate"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - if: ${{ !cancelled() }}
        run: gate
      - name: Package the Thunderstore zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/MortarBepInExBridge/MortarBepInExBridge.csproj)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match csproj Version $version" >&2
            exit 1
          fi
          scripts/package.sh
      - name: Keep the zip for the release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Only a v* tag publishes, so only this job can write to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi

  # Uploads the zip the release job attached, after that release exists, so GitHub and Thunderstore carry the same file.
  thunderstore:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      # tcli targets net6.0/net7.0; roll-forward runs it on the .NET 10 runtime installed above.
      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install --global tcli --version 0.2.4
          tcli publish --config-path thunderstore.toml --file "dist/MortarBepInExBridge-${GITHUB_REF_NAME#v}.zip"

  # Nexus Mods hosts one page per game; both get the release's BepInEx-tree zip.
  nexus:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the Nexus zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "MortarBepInExBridge-$version-nexus.zip"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Upload to Nexus Mods (Lethal Company mod 315)
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2  # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: 315
          file_id: 606
          filename: MortarBepInExBridge-${{ steps.zip.outputs.version }}-nexus.zip
          version: ${{ steps.zip.outputs.version }}
          display_name: Mortar BepInEx Bridge
          archive_existing_version: true
          update_mod_version: true
          changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      - name: Upload to Nexus Mods (Valheim mod 4444)
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2  # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: 4444
          file_id: 25550
          filename: MortarBepInExBridge-${{ steps.zip.outputs.version }}-nexus.zip
          version: ${{ steps.zip.outputs.version }}
          display_name: Mortar BepInEx Bridge
          archive_existing_version: true
          update_mod_version: true
          changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

  # The plugin does not depend on the game version, so each file is tagged with every version CurseForge lists for its game.
  curseforge:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: Lethal Company
            host: lethal-company.curseforge.com
            project: 1747636
          - game: Valheim
            host: valheim.curseforge.com
            project: 1747644
    name: curseforge (${{ matrix.game }})
    steps:
      - name: Upload to CurseForge (project ${{ matrix.project }})
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          API: https://${{ matrix.host }}/api
          PROJECT: ${{ matrix.project }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="MortarBepInExBridge-$version-nexus.zip"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$zip"
          curl -fsS --config <(printf 'header = "X-Api-Token: %s"\n' "$CURSEFORGE_TOKEN") "$API/game/versions" >versions.json
          metadata="$(python3 - "$version" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" <<'PY'
          import json, sys
          ids = [v["id"] for v in json.load(open("versions.json"))]
          print(json.dumps({"changelog": sys.argv[2], "changelogType": "text", "displayName": f"Mortar BepInEx Bridge {sys.argv[1]}", "gameVersions": ids, "releaseType": "release"}))
          PY
          )"
          curl -fsS --config <(printf 'header = "X-Api-Token: %s"\n' "$CURSEFORGE_TOKEN") \
            -F "metadata=$metadata" -F "file=@$zip" "$API/projects/$PROJECT/upload-file"
