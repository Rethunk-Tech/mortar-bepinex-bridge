# One file per package, read by tcli in CI's publish job and by scripts/package.sh for the description. The version comes
# from manifest.json inside the zip scripts/package.sh builds. The Valheim build.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Mortar"
name = "MortarBepInExBridge_Valheim"
description = "Mortar BepInEx Bridge for Valheim: lets the Mortar mod manager query the running game, run console commands in it and show stream-overlay values. Installed by Mortar."
websiteUrl = "https://github.com/Rethunk-Tech/mortar-bepinex-bridge"
containsNsfwContent = false

[package.dependencies]

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["tools", "client-side"]

