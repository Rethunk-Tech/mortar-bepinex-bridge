# One file per package, read by tcli in CI's publish job and by scripts/package.sh for the description. The version comes
# from manifest.json inside the zip scripts/package.sh builds. This is the core build, for the games with no build of their own.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Mortar"
name = "MortarBepInExBridge"
description = "Lets the Mortar mod manager query a running BepInEx game over a token-protected loopback socket. Installed by Mortar."
websiteUrl = "https://github.com/Rethunk-Tech/mortar-bepinex-bridge"
containsNsfwContent = false

[package.dependencies]

[publish]
repository = "https://thunderstore.io"
communities = ["repo", "peak", "riskofrain2", "content-warning"]

