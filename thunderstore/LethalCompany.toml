# One file per package, read by tcli in CI's publish job and by scripts/package.sh for the description. The version comes
# from manifest.json inside the zip scripts/package.sh builds. The LethalCompany build.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Mortar"
name = "MortarBepInExBridge_LethalCompany"
description = "Mortar BepInEx Bridge for Lethal Company: lets the Mortar mod manager query the running game, skip its intro and show stream-overlay values. Installed by Mortar."
websiteUrl = "https://github.com/Rethunk-Tech/mortar-bepinex-bridge"
containsNsfwContent = false

[package.dependencies]

[publish]
repository = "https://thunderstore.io"
communities = ["lethal-company"]

[publish.categories]
lethal-company = ["tools", "clientside"]

